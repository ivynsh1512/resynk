<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CE8D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7A33"/>
    </linearGradient>
    <linearGradient id="crestGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem Mark -->
  <g transform="translate(4, 4)">
    <!-- Base Shield / Rounded Hexagon -->
    <rect width="56" height="56" rx="14" fill="url(#crestGlow)" stroke="url(#goldLinear)" stroke-width="1.2"/>
    
    <!-- Fine Inner Border -->
    <rect x="3" y="3" width="50" height="50" rx="11" fill="none" stroke="rgba(232, 206, 141, 0.2)" stroke-width="0.8"/>

    <!-- Resonant Strings & Acoustic Soundwaves -->
    <!-- Vertical Instrument Strings -->
    <line x1="22" y1="14" x2="22" y2="42" stroke="url(#goldLinear)" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="28" y1="11" x2="28" y2="45" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="34" y1="14" x2="34" y2="42" stroke="url(#goldLinear)" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Harmonic Soundwave Curvature (Harp / Guitar Bridge) -->
    <path d="M16 28 C20 22, 36 22, 40 28 C36 34, 20 34, 16 28 Z" fill="none" stroke="url(#goldLinear)" stroke-width="1.4" opacity="0.85"/>
    <circle cx="28" cy="28" r="3" fill="url(#goldLinear)"/>
    <circle cx="28" cy="11" r="1.5" fill="#E8CE8D"/>
    <circle cx="28" cy="45" r="1.5" fill="#E8CE8D"/>
  </g>

  <!-- Typography: resynk -->
  <text x="72" y="36" font-family="'Playfair Display', Georgia, serif" font-size="27" font-weight="700" letter-spacing="-0.5" fill="#FAF9F6">re<tspan fill="url(#goldLinear)">synk</tspan></text>
  
  <!-- Subtitle: D Paul's Academy • Bangalore -->
  <text x="73" y="49" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="1.4" fill="#9DA3B4" text-transform="uppercase">D PAUL'S ACADEMY &bull; SINCE 2014</text>
</svg>
